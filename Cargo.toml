[package]
name = "vio" # Mudamos o nome interno aqui! O executável se chamará verinoff.exe (ou vio.exe)
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
calamine = "0.22"
zip = "2.1"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
rusqlite = { version = "0.31.0", features = ["bundled"] }
regex = "1.10.4"
self_update = "0.41"
dirs = "5.0"